schema_version: 1

shelf:
  width_m: 2.4
  depth_m: 0.9
  support_thickness_m: 0.04
  divider_thickness_m: 0.025
  divider_height_m: 0.42
  # Seven dividers bound six lanes. Each key is the URDF link element name the workcell xacro
  # generates from it; entries are ordered left to right, so the lane between consecutive
  # entries is the one named between them.
  divider_x_m:
    left_frame: -1.2
    lane_01_02_divider: -0.8
    lane_02_03_divider: -0.4
    lane_03_04_divider: 0.0
    lane_04_05_divider: 0.4
    lane_05_06_divider: 0.8
    right_frame: 1.2
  # The front rail every gravity-fed product ends up leaning on, 0.06 m deep (0.03 m as a flat
  # shelf's retaining lip). Its face, at depth_m - this, is where a product stops, tilted with
  # the bed: it touches the rail at the rail's top edge and leans past it by
  # (height - front_retainer_height_m) * tan(lane_incline_deg), 0.014 m for the 0.290 m large
  # bottle. Pulling the face back to 0.84 keeps that lean inside the lane usable volume, which
  # still ends at 0.86, so occupancy and obstruction measurements are unchanged.
  front_retainer_depth_m: 0.06
  front_retainer_height_m: 0.09
  # The lane floor is a gravity-feed roller bed. It rises toward the rear at this angle, so a
  # product set down near the lane mouth rolls forward and comes to rest against the front
  # retainer. Zero height is the roller surface at the retainer face (depth_m minus
  # front_retainer_depth_m, 0.84), where every settled product ends up, so the lane usable
  # volumes below keep their floor at z = 0. Behind that face the surface stands
  # (0.84 - depth) * tan(incline) higher; at the shelf's rear lip that is 0.059 m.
  #
  # 4 degrees is measured in DART, not derived. Two bounds close in on it, both sampled with the
  # surveyed lane, the real retainer and the three catalogued products:
  #   * Too shallow and a product stalls. The bed's surface friction (0.05, set in
  #     workcell.xacro) is what a free-running roller costs; DART takes the smaller of the two
  #     contacting coefficients, so the bed governs. Motion needs tan(incline) > 0.05; at 4
  #     degrees tan is 0.0699, leaving 29% of the driving force after friction. At 0.08 friction,
  #     4 degrees stalls the large bottle at lane depth 0.22.
  #   * Too steep and it arrives too fast to stay upright. The retainer catches the large bottle
  #     0.055 m below its centre of mass, so a fast arrival pitches it over: it tipped at 0.84 m/s
  #     (4 degrees, 0.02 friction) and 0.89 m/s (6 degrees, 0.05 friction), and stayed upright at
  #     0.67 m/s. 4 degrees at 0.05 arrives at 0.53 m/s.
  # All three products reach the rail 2.3-2.5 s after release and are stationary by 2.8 s of
  # simulated time, with no lateral drift, resting against it tilted with the bed. Nothing may
  # read a placed product's pose as final before that: see the release hold in
  # restocker_task_executor/include/restocker_task_executor/world_snapshot_projection.hpp.
  lane_incline_deg: 4.0
  # Roller radius and spacing. The rollers carry no collision: the bed is a smooth inclined plane
  # tangent to them, with roller friction. Modelling them would mean 15 spinning bodies and
  # revolute joints per lane, and a can's flat base would drop between two of them.
  roller_radius_m: 0.009
  roller_pitch_m: 0.06

stock_tray:
  width_m: 1.4
  depth_m: 0.55
  thickness_m: 0.04
  center_xyz_m: [0.0, -1.35, -0.20]
  usable_volume:
    center_xyz_m: [0.0, -1.35, -0.005]
    size_xyz_m: [1.36, 0.51, 0.35]
    # The surveyed floor is the tray surface itself, so a seated product touches it exactly and
    # contact penetration or pose noise reads as "outside the tray". This lowers only that face.
    floor_settle_tolerance_m: 0.002

# Six lanes at a 0.4 m pitch, two per product class, so a product always has a compatible
# alternative when one of its lanes is occupied or obstructed and task selection has a real choice
# to score. The lane bounds derive from the divider positions above: consecutive dividers are
# 0.4 m apart and 0.025 m thick, leaving 0.375 m of clear span, of which 0.365 m is usable once
# side_clearance_m is taken off each side. The widest catalogued product is the large bottle at
# 0.045 m radius (product_collision_catalog.yaml), so 0.09 m of the span is occupied.
#
# Every lane repeats the same surveyed depth and height. The per-lane values are spelled out
# instead of shared through a YAML anchor: yaml-cpp, which the C++ loaders in
# restocker_task_executor, restocker_world_state and restocker_gazebo use, does not implement
# merge keys, so an anchor would load differently in Python and in C++.
#
# usable_depth_m/usable_height_m and the clearances are the same for every lane:
#   * The usable volume starts at the roller surface where a settled product rests, the retainer
#     face: lifting the floor above it would put every settled product below the lane and read as
#     an obstruction. Behind that the bed rises, so a product further back sits above this floor
#     and is still contained. The settle tolerance lowers only that face, as
#     stock_tray.usable_volume.floor_settle_tolerance_m does, so contact penetration and pose
#     noise on a seated product do not read as "outside the lane". usable_height_m has to hold a
#     product standing at the lane mouth, where the bed is highest: the 0.290 m large bottle is
#     released with its base 0.061 m up and reaches 0.351 m.
#   * front_clearance_m is the margin between the usable volume's front face and the shelf's front
#     edge. The retainer is inside the volume because a gravity-fed product comes to rest leaning
#     on it; a volume stopping short of it would report completed placements as obstructions.
#   * insert_entry_clearance_m is the clear depth the release leaves behind the product's rear
#     face, and the only surveyed part of the release depth. The depth is derived per transfer
#     (a lane holds a column of differently wide products): the arm lets go at
#     rear_clearance_m + the product's radius + this, so the large bottle is released at 0.100,
#     the small bottle at 0.089 and the can at 0.088. Where the product ends up is set by
#     shelf.lane_incline_deg, which carries it forward until it stops against the retainer or the
#     product already there.
#     This replaced final_product_center_depth_m at 0.78, which made the arm carry a product
#     0.66 m into a 0.375 m slot before the linear insert began; forearm_link then had to lean
#     past the far face of the adjacent divider, and that contact truncated the Cartesian insert
#     in 7 of 24 measured runs. 0.045 reproduces the 0.100 release depth at which the 39
#     untruncated inserts of 2026-09-10 were measured, for the product they used, so a narrower
#     product is now released nearer the mouth and never deeper.
#     It is a clearance, so narrowing the lanes does not disturb it.
lanes:
  lane_01:
    frame_id: lane_01
    center_x_m: -1.0
    usable_width_m: 0.365
    usable_depth_m: 0.85
    usable_height_m: 0.40
    rear_clearance_m: 0.01
    side_clearance_m: 0.005
    floor_clearance_m: 0.0
    floor_settle_tolerance_m: 0.002
    front_clearance_m: 0.01
    insert_entry_clearance_m: 0.045
    insertion_axis: [0.0, 1.0, 0.0]
  lane_02:
    frame_id: lane_02
    center_x_m: -0.6
    usable_width_m: 0.365
    usable_depth_m: 0.85
    usable_height_m: 0.40
    rear_clearance_m: 0.01
    side_clearance_m: 0.005
    floor_clearance_m: 0.0
